# Exceptions for the grype scan in the image job of ci.yml. Each entry covers
# one package and one CVE, and carries a reason and an expiry date
# (`# expires: YYYY-MM-DD`). The step "Check grype exceptions have not
# expired" fails CI once the date has passed, so an exception cannot linger by
# mistake: fix it, extend it with a new reason, or remove it.
ignore:
  # sqlite-libs 3.54.1-1.hum1 in the Hummingbird base: High, no fixed version
  # published yet. The service does not use sqlite.
  # expires: 2026-12-15
  - vulnerability: CVE-2026-119586
    package:
      name: sqlite-libs
      type: rpm

  # libuuid 2.42.4-2.1.hum1 in the Hummingbird base: High, no fixed version
  # published yet. The service code does not generate UUIDs.
  # expires: 2026-12-15
  - vulnerability: CVE-2026-53615
    package:
      name: libuuid
      type: rpm

  # ffmpeg 9.0.2 bundled in the opencv-python-headless 5.1.0.95 wheel (only
  # for cv2 video I/O): High, no fixed version published yet. The service
  # never opens video (no VideoCapture/VideoWriter), so libavcodec is not
  # reached. Scoped to this ffmpeg version so a newer wheel drops the match.
  # expires: 2026-12-15
  - vulnerability: CVE-2026-107696
    package:
      name: ffmpeg
      version: 9.0.2
      type: binary
  # openssl 3.5.9-0.5.hum1 in the Hummingbird base (also -0.4): High, no fixed
  # version published yet. Both CVEs are memory-exhaustion DoS in OpenSSL's
  # QUIC server stack. The service speaks plain HTTP (gunicorn) behind the
  # proxy, and Python's ssl module exposes no QUIC, so the code is never reached.
  # expires: 2026-12-15
  - vulnerability: CVE-2026-124709
    package:
      name: openssl-libs
      type: rpm
  # expires: 2026-12-15
  - vulnerability: CVE-2026-124709
    package:
      name: openssl-fips-provider-upstream
      type: rpm
  # expires: 2026-12-15
  - vulnerability: CVE-2026-107494
    package:
      name: openssl-libs
      type: rpm
  # expires: 2026-12-15
  - vulnerability: CVE-2026-107494
    package:
      name: openssl-fips-provider-upstream
      type: rpm

