name: Deploy to the VM on a tag

# A tag on this repo redeploys ONLY this service on the Scaleway VM, pinned to
# that tag, with no manual step on the box.
#
# The deploy itself lives in server_lux
# (.github/workflows/deploy-scaleway.yml). This triggers it with
# inputs {service: encoder, service_ref: <tag>}; it then pins ENCODER_REF and runs
# `deploy-scaleway.sh --service encoder-service --build` over SSH, leaving every
# other service's container and checkout untouched. Keeping the deploy there
# means the SSH key and the deploy logic live in one repo instead of being
# copied into all four and rotated in four places.
#
# Requires the SERVER_LUX_DISPATCH_TOKEN secret: a token with **Actions: write**
# on upskiller-xyz/server_lux — that is all the workflow-dispatch endpoint
# needs. Deliberately not repository_dispatch, which sits under Contents: write
# and would additionally let this token push code to server_lux. The default
# GITHUB_TOKEN cannot dispatch to another repository either way.

on:
  push:
    tags: ["v*"]

# Nothing here uses GITHUB_TOKEN; the dispatch authenticates with its own token.
permissions: {}

concurrency:
  # Trims a trigger that a newer tag has already superseded, which is all this
  # can do: the run ends when the dispatch is ACCEPTED, not when the deploy
  # finishes, and GitHub does not guarantee the execution order of runs in a
  # concurrency group. Release order is therefore enforced where it can be —
  # inside the deploy on the VM, which rejects a release older than the one it
  # already has (see server_lux deploy-scaleway.sh).
  group: deploy-on-tag
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Ask server_lux to redeploy encoder at this tag
        env:
          TOKEN: ${{ secrets.SERVER_LUX_DISPATCH_TOKEN }}
          SERVICE: encoder
          TAG: ${{ github.ref_name }}
          # Monotonic per repo and always increasing, so the deploy can compare
          # two releases of this service and refuse the older one. The tag name
          # cannot serve: it is not reliably ordered (v1.10.0 vs v1.9.0) and a
          # tag can be force-moved.
          ORDER: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Fail loudly instead of skipping: a tag that silently deploys
          # nothing is worse than a red release.
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::SERVER_LUX_DISPATCH_TOKEN is not set — $TAG was published but nothing was deployed."
            exit 1
          fi
          # "ref" selects which branch of server_lux runs the workflow; the tag
          # being deployed travels as the service_ref INPUT. The two are
          # unrelated, which is why the input is not called "ref".
          payload="$(jq -nc --arg s "$SERVICE" --arg r "$TAG" --arg o "$ORDER" \
            '{ref:"master",inputs:{service:$s,service_ref:$r,release_order:$o}}')"
          # -f: a 4xx/5xx fails the step. A successful dispatch returns 204 with
          # an empty body, so there is nothing to read back.
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/upskiller-xyz/server_lux/actions/workflows/deploy-scaleway.yml/dispatches \
            -d "$payload"
          echo "Triggered deploy-scaleway.yml for $SERVICE @ $TAG."
