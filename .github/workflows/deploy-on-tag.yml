name: Deploy to the VM on a tag

# A tag on this repo redeploys ONLY this service on the Scaleway VM, pinned to
# that tag, with no manual step on the box.
#
# The deploy itself lives in server_lux
# (.github/workflows/deploy-scaleway.yml). It receives this dispatch, resolves
# ENCODER_REF from the payload and runs
# `deploy-scaleway.sh --service encoder-service --build` over SSH, leaving every
# other service's container and checkout untouched. Keeping the deploy there
# means the SSH key and the deploy logic live in one repo instead of being
# copied into all four and rotated in four places.
#
# Requires the SERVER_LUX_DISPATCH_TOKEN secret: a token with **Contents:
# write** on upskiller-xyz/server_lux, which is what POST /dispatches needs.
# The default GITHUB_TOKEN cannot dispatch to another repository. Contents:
# write also permits pushing to server_lux — GitHub has no narrower scope for
# repository dispatch — so use a token dedicated to this workflow and rotate it
# on the same schedule as the deploy key.

on:
  push:
    tags: ["v*"]

# Nothing here uses GITHUB_TOKEN; the dispatch authenticates with its own PAT.
permissions: {}

concurrency:
  # Two tags pushed close together would otherwise race to deploy the same
  # service; the later one should win rather than whichever SSH finishes last.
  group: deploy-on-tag
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Ask server_lux to redeploy encoder at this tag
        env:
          TOKEN: ${{ secrets.SERVER_LUX_DISPATCH_TOKEN }}
          SERVICE: encoder
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Fail loudly instead of skipping: a tag that silently deploys
          # nothing is worse than a red release.
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::SERVER_LUX_DISPATCH_TOKEN is not set — $TAG was published but nothing was deployed."
            exit 1
          fi
          # jq builds the body so the tag cannot break the JSON, whatever it
          # contains. server_lux validates the ref again on receipt.
          payload="$(jq -nc --arg s "$SERVICE" --arg r "$TAG" \
            '{event_type:"service-tag",client_payload:{service:$s,ref:$r}}')"
          # -f: a 4xx/5xx fails the step. A successful dispatch returns 204 with
          # an empty body, so there is nothing to read back.
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/upskiller-xyz/server_lux/dispatches \
            -d "$payload"
          echo "Dispatched service-tag for $SERVICE @ $TAG."
