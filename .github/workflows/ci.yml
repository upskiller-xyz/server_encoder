name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly: new advisories appear without any code change.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/ --cov=src --cov-report=xml --cov-report=html -v

      - name: Generate coverage report
        if: always()
        run: |
          {
            echo "## Test Coverage Report"
            echo ""
            echo "Tests completed successfully! ✅"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Ruff (lint + format)
        run: |
          python -m pip install "ruff==0.17.1"
          # Rules and excludes come from [tool.ruff] in pyproject.toml.
          ruff check .
          ruff format --check .

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Audit dependencies (blocking)
        run: |
          python -m pip install "pip-audit==2.10.1"
          # requirements.txt holds version ranges, not hashed pins, so pip-audit
          # resolves it in a throwaway venv (no --disable-pip) and audits the
          # whole resolved tree, transitive packages included.
          pip-audit --requirement requirements.txt --strict

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t encoder:scan .

      # Scans the built image: the Hummingbird base's OS packages (grype reads
      # its rpm database) and the Python packages in the venv. Blocking on
      # high; the table in the log lists every finding regardless of cutoff.
      - name: Scan image (blocking on high)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: encoder:scan
          fail-build: true
          severity-cutoff: high
          output-format: table
          by-cve: true
